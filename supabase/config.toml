project_id = "agroinblue-local"
# OPENFINANCE-PILOTO-01 · P2 — o webhook da Pluggy é PÚBLICO (a Pluggy não manda JWT do Supabase): quem protege é o cabeçalho
# secreto conferido na função (`_shared/pluggy.ts`, `receberAviso`). As outras duas funções seguem com o JWT.
[functions.openfinance-webhook]
verify_jwt = false
# BOLETO D3b — a porta do e-mail de boletos é PÚBLICA (a Lambda do SES não tem JWT do Supabase): quem protege é a assinatura HMAC
# conferida na função (`_shared/entradaEmail.ts`, `receber`).
[functions.entrada-email]
verify_jwt = false
