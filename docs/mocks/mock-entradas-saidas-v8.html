<body>
<div id="app"></div>
<script>
// ---------------- meses (jan/25 a dez/27); mês atual = out/26 ----------------
const ABR=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MS=[];for(let y=2025;y<=2027;y++)for(let m=0;m<12;m++)MS.push({y,m,lb:ABR[m]+'/'+String(y).slice(2)});
const ATUAL=MS.findIndex(x=>x.y===2026&&x.m===9);

// ---------------- contas (nomes da sua Conciliação; pesos e saldos ilustrativos) ----------------
const CONTAS=[
 ['Itaú Personnalité','Conta corrente',.36,92000],['Caixa Econômica','Conta corrente',.06,6500],['Itaú PJ','Conta corrente',.08,8000],['Sicoob-GF','Conta corrente',.04,2000],
 ['Sicoob-HJ','Conta corrente',.02,300],['Avenue','Conta corrente',.03,12000],['Master Black Itaú','Cartão de crédito',.12,-6200],['Visa Infinite Itaú','Cartão de crédito',.17,-11800],
 ['Consórcio Caixa','Investimento',.04,35000],['Itaú CDB-DI','Investimento',.03,15000],['Itaú Cofrinhos','Investimento',.03,9000],['Itaú Corretora','Investimento',.02,7600]];

// ---------------- plano (saídas de out/26 por categoria = valores reais do seu Dashboard) ----------------
const BASE={
 sai:{titulo:'Saídas',cores:['#b3261e','#d0614f','#e8998a','#7f1d1d','#44546a','#7d8ba1','#2e7d8a','#79b4bd','#e0a458','#8a8f98','#c9ced6'],
  grupos:[['Custo de vida','#b3261e'],['Financiamentos','#44546a'],['Investimentos em patrimônio','#2e7d8a'],['Outras saídas','#a7aeb8']],
  cats:[
  ['Dependentes',7084.00,0,-0.006,[['Pensão',.45],['Escola',.3],['Plano de saúde',.17],['Outros',.08]]],
  ['Moradia',3991.05,0,0.026,[['Aluguel / prestação',.5],['Condomínio',.14],['Energia elétrica',.13],['Água',.04],['Internet e telefone',.07],['Manutenção e limpeza',.12]]],
  ['Transporte',1064.56,0,0.008,[['Combustível',.55],['Manutenção do veículo',.2],['Seguro e IPVA',.15],['Apps e pedágio',.1]]],
  ['Alimentação',1059.10,0,0.012,[['Supermercado',.6],['Restaurantes',.27],['Delivery',.13]]],
  ['Proteção',1049.45,0,0,[['Seguro de vida',.5],['Seguro residencial',.2],['Previdência',.3]]],
  ['Saúde',988.74,0,-0.004,[['Plano de saúde',.62],['Consultas',.18],['Farmácia',.14],['Dentista',.06]]],
  ['Pessoal',531.90,0,0.01,[['Vestuário',.45],['Cuidados pessoais',.35],['Assinaturas',.2]]],
  ['Bens de Consumo',362.56,0,0.02,[['Eletrônicos',.6],['Casa e decoração',.4]]],
  ['Eventos',124.00,0,0,[['Presentes',.6],['Festas',.4]]],
  ['Náuticos',80.42,0,0,[['Marina',.7],['Manutenção',.3]]],
  ['Financeiro e Taxas',35.00,0,0,[['Tarifas bancárias',.8],['IOF',.2]]],
  ['Financiamentos',12376.10,1,-0.004,[['Imóvel',.7],['Veículo',.3]]],
  ['Imobilizado',1651.96,2,0,[['Obras',.65],['Equipamentos',.35]]],
  ['AgroinBLUE',5110.26,3,0.004,[['Aportes',.7],['Despesas',.3]]],
  ['Fazenda',4013.85,3,0.002,[['Aportes',.6],['Despesas',.4]]],
  ['Ajustes Operacionais',1147.08,3,0,[['Ajustes',1]]]]},
 ent:{titulo:'Entradas',cores:['#1f3864','#3c6db3','#79a0d6','#2e7d8a','#79b4bd','#8a8f98','#c9ced6'],
  grupos:[['Receitas','#1f3864'],['Rendimentos financeiros','#3c6db3'],['Outras entradas','#9fb6d8']],
  cats:[
  ['Salário / pró-labore',22000.00,0,0,[['Pró-labore',1]]],
  ['Aluguéis recebidos',6500.00,0,0,[['Imóvel 1',.6],['Imóvel 2',.4]]],
  ['Serviços prestados',3636.50,0,-0.01,[['Consultoria',1]]],
  ['Aplicações (CDB)',2100.35,1,0.01,[['CDB',1]]],
  ['Fundos',1450.12,1,0.01,[['Fundos DI',1]]],
  ['Reembolsos',2210.00,2,0,[['Despesas reembolsadas',1]]],
  ['Diversos',1512.02,2,0,[['Outros',1]]]]}
};
const FAV={'Supermercado':['Mercado Central','Atacado Bom Preço','Hortifruti da Vila'],'Restaurantes':['Cantina do Porto','Restaurante Sabor & Cia'],'Delivery':['App de entrega'],'Combustível':['Posto Avenida','Posto Rodovia'],'Plano de saúde':['Operadora de saúde'],'Farmácia':['Farmácia do Bairro','Drogaria Central'],'Pensão':['Pensão alimentícia'],'Escola':['Colégio'],'Energia elétrica':['Distribuidora de energia'],'Água':['Companhia de saneamento'],'Internet e telefone':['Operadora de internet','Operadora de celular'],'Condomínio':['Condomínio Edifício'],'Aluguel / prestação':['Imobiliária'],'Pró-labore':['AgroinBLUE'],'Consultoria':['Clientes de consultoria']};

const br=(v,d)=>v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const R=v=>(v<0?'−':'')+'R$ '+br(Math.abs(v),2);
const N0=v=>(v<0?'−':'')+br(Math.round(Math.abs(v)),0);
const K1=v=>(v<0?'−':'')+br(Math.abs(v)/1000,1);
const pct=(a,b)=>br(b?a/b*100:0,1)+'%';
const sinal=x=>(x>0.05?'+':(x<-0.05?'−':''))+br(Math.abs(x),0)+'%';
const neg=v=>(v<0?'−':'')+br(Math.abs(v),2);
const media=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const soma=a=>a.reduce((x,y)=>x+y,0);
const corRes=v=>v<0?'var(--red)':'var(--green)';

// ---------------- árvore do plano: raiz → grupos → categorias → subcentros ----------------
const TREE={};
for(const tp of ['sai','ent']){
  const B=BASE[tp];
  const root={nome:B.titulo,cor:'#1b2430',kids:[],path:[],tp};
  B.grupos.forEach(([n,c],gi)=>root.kids.push({nome:n,cor:c,kids:[],path:[gi],tp}));
  B.cats.forEach(([n,v,gi,t,subs],idx)=>{
    const g=root.kids[gi];const ci=g.kids.length;
    const serie=MS.map((x,i)=>{const k=ATUAL-i;const onda=k?0.08*Math.sin(k*1.7+idx):0;return Math.max(0,Math.round(v*(1+t*k+onda)*100)/100);});
    const meta=Math.round(media(serie.slice(ATUAL-9,ATUAL+1))*(tp==='sai'?0.95:1));
    const cat={nome:n,cor:B.cores[ci%B.cores.length],kids:[],path:[gi,ci],tp,s:serie,meta};
    subs.forEach(([sn,w],si)=>cat.kids.push({nome:sn,cor:'#8a8f98',kids:[],path:[gi,ci,si],tp,w,s:[],meta:Math.round(meta*w*(1+0.12*Math.sin(si*2.3+idx)))}));
    const mt=soma(cat.kids.map(x=>x.meta));cat.kids[cat.kids.length-1].meta+=meta-mt;
    MS.forEach((x,i)=>{const ws=subs.map(([a,w],si)=>w*(1+(i===ATUAL?0:0.15*Math.sin(i*1.3+si*2.1+idx))));const tt=soma(ws);let acc=0;
      cat.kids.forEach((sb,si)=>{const vv=si===cat.kids.length-1?Math.round((serie[i]-acc)*100)/100:Math.round(serie[i]*ws[si]/tt*100)/100;acc+=vv;sb.s.push(vv);});});
    g.kids.push(cat);
  });
  root.kids.forEach(g=>{g.kids.sort((a,b)=>b.s[ATUAL]-a.s[ATUAL]);g.kids.forEach((c,ci)=>{c.path=[g.path[0],ci];c.cor=B.cores[ci%B.cores.length];c.kids.forEach((s,si)=>s.path=[g.path[0],ci,si]);});
    g.s=MS.map((x,i)=>soma(g.kids.map(c=>c.s[i])));g.meta=soma(g.kids.map(c=>c.meta));});
  root.s=MS.map((x,i)=>soma(root.kids.map(g=>g.s[i])));root.meta=soma(root.kids.map(g=>g.meta));
  TREE[tp]=root;
}
const nodeAt=(tp,path)=>path.reduce((n,i)=>n.kids[i],TREE[tp]);
const SALDO0=168400;
const ULT_CONC=[22,21,22,20,15,19,18,21,22,22,22,22]; // último dia conciliado em out/26, por conta (ilustrativo)

// ---------------- estado ----------------
const S={tipo:'flx',sel:ATUAL,faixa:'ano',de:ATUAL-9,ate:ATUAL+2,contas:CONTAS.map(()=>true),pop:null,pyDe:2026,pyAte:2026,
  m:null /* {tp, tab:-1 raiz | índice do grupo} */,row:-1,sub:-1,modo:'mes',dw:null};
const W=()=>soma(CONTAS.map((c,i)=>S.contas[i]?c[2]:0));
const val=(n,i)=>n.s[i]*W();
const metaV=n=>n.meta*W();
function faixa(){
  const y=MS[S.sel].y;
  if(S.faixa==='ano')return[MS.findIndex(x=>x.y===y&&x.m===0),MS.findIndex(x=>x.y===y&&x.m===11)];
  if(S.faixa==='u12')return[Math.max(0,S.sel-11),S.sel];
  if(S.faixa==='66')return[Math.max(0,S.sel-5),Math.min(MS.length-1,S.sel+6)];
  return[Math.min(S.de,S.ate),Math.max(S.de,S.ate)];
}
const idxs=()=>{const[a,b]=faixa();const o=[];for(let i=a;i<=b;i++)o.push(i);return o;};
const realIdx=()=>idxs().filter(i=>i<=ATUAL);
const set=p=>{Object.assign(S,p);render();};
const saldoIni=i=>{let c=0;for(let j=0;j<i;j++)c+=TREE.ent.s[j]-TREE.sai.s[j];return soma(CONTAS.map((x,k)=>S.contas[k]?x[3]:0))+c*W();};

function donut(itens,total,size,hole,label){
  let acc=0;const g='conic-gradient('+itens.map(([cor,v])=>{const a=acc;acc+=total?v/total*100:0;return cor+' '+a.toFixed(2)+'% '+acc.toFixed(2)+'%';}).join(', ')+')';
  return `<div class="donut" style="width:${size}px;height:${size}px;background:${g}" role="img" aria-label="Gráfico de rosca"><div class="hole" style="width:${hole}px;height:${hole}px">${label}</div></div>`;
}

// ---------------- gráfico de colunas (SVG em pixels reais) ----------------
function chartSVG(el,cfg){
  const W0=el.clientWidth,H=el.clientHeight;if(!W0||!H)return;
  const ix=cfg.ix,n=ix.length,ns=cfg.series.length,l2=cfg.linha2;
  const anos=new Set(ix.map(i=>MS[i].y));const dois=anos.size>1;
  const L=34,Rm=cfg.media||cfg.meta?30:6,T=14,B=dois?24:14,iw=W0-L-Rm,ih=H-T-B;
  const real=ix.map(i=>i<=ATUAL);
  const nice=x=>{const p=Math.pow(10,Math.floor(Math.log10(x)));const m=x/p;return(m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p;};
  const todos=cfg.series.flatMap(s=>s.vals).concat(l2?l2.vals:[],[cfg.meta||0,0]);
  const mx=Math.max(...todos,1),mn=Math.min(...todos);
  const useK=Math.max(mx,-mn)>=2000;
  const pL=nice((mx-Math.min(mn,0))*1.1/4);const up=Math.ceil(mx*1.08/pL),dn=mn<0?Math.ceil(-mn*1.08/pL):0;
  const tot=up+dn;
  const Y=v=>T+ih*(up-v/pL)/tot,YR=Y,y0=Y(0);
  const slot=iw/n,X=k=>L+(k+.5)*slot;
  const bw=Math.min(34,slot*(ns>1?.38:.62));
  const fmtL=v=>useK?K1(v):N0(v);
  const halo='paint-order="stroke" stroke="#fff" stroke-width="3" stroke-linejoin="round"';
  let s=`<svg width="${W0}" height="${H}" style="display:block" aria-hidden="true"><defs><pattern id="hp${cfg.id}" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#fff" stroke-width="2" stroke-opacity=".6"/></pattern></defs>`;
  const fut=ix.findIndex(i=>i>ATUAL);
  if(fut>=0){const x0=L+fut*slot;s+=`<rect x="${x0}" y="${T}" width="${L+iw-x0}" height="${ih}" fill="#f4f6f9"/><text x="${x0+3}" y="${T+8}" font-size="7.5" fill="#8d9cad">previsto</text>`;}
  if(dn>0)s+=`<rect x="${L}" y="${y0}" width="${iw}" height="${T+ih-y0}" fill="#fbf3f3" opacity=".7"/>`;
  for(let k=-dn;k<=up;k++){const y=T+ih*(up-k)/tot;
    s+=`<line x1="${L}" x2="${L+iw}" y1="${y}" y2="${y}" stroke="${k===0?'#8a96a6':'#eceff3'}" stroke-width="${k===0?1.2:1}"/>`;
    s+=`<text x="${L-4}" y="${y+3}" font-size="7.5" text-anchor="end" fill="${k<0?'#b3261e':'#6b7787'}">${k===0?'0':(k<0?'−':'')+(useK?br(Math.abs(k*pL)/1000,(pL/1000)%1?1:0):N0(Math.abs(k*pL)))}</text>`;
  }
  s+=`<text x="2" y="${T-5}" font-size="7.5" fill="#6b7787">${useK?'R$ mil':'R$'}</text>`;
  s+=`<line x1="${L}" x2="${L}" y1="${T}" y2="${T+ih}" stroke="#b8c0cb"/>`;
  const mAc=ix.map(()=>null);if(cfg.media){let ac=0,q=0;cfg.series[0].vals.forEach((v,k)=>{if(real[k]){ac+=v;q++;mAc[k]=ac/q;}});}
  const espaco=ns>1?slot/2:slot;
  ix.forEach((i,k)=>{
    cfg.series.forEach((se,si)=>{
      const v=se.vals[k],off=ns>1?(si-.5)*(bw+2):0,x=X(k)+off-bw/2,yv=Y(v),y=Math.min(yv,y0),h=Math.abs(yv-y0);
      s+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${real[k]?se.cor:se.corP}"${i===S.sel?' stroke="#1b2430" stroke-width="1.2"':''}><title>${MS[i].lb} · ${se.nome}: ${R(v)}${real[k]?'':' (previsto)'}</title></rect>`;
      if(!real[k])s+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="url(#hp${cfg.id})" pointer-events="none"/>`;
      const lab=fmtL(v),lw=lab.length*4.4+6;
      if(bw>=9&&h>lw){
        const cx=X(k)+off,ty=v>=0?y0-4:y0+4;
        s+=`<text transform="translate(${cx},${ty}) rotate(-90)" font-size="7.5" text-anchor="${v>=0?'start':'end'}" dominant-baseline="central" fill="${real[k]?'#fff':'#5b6878'}" font-weight="${i===S.sel?700:400}" pointer-events="none">${lab}</text>`;
      }else if(i===S.sel||ns===1){
        s+=`<text x="${X(k)+off}" y="${v>=0?y-3:y+h+9}" font-size="7.5" text-anchor="middle" fill="${real[k]?se.txt:'#8d9cad'}" ${halo} pointer-events="none">${lab}</text>`;
      }
    });
  });
  const passoX=Math.max(1,Math.ceil(22/slot));
  const mostra=new Set(ix.filter(i=>MS[i].m%passoX===0));
  if(passoX>1&&!mostra.has(S.sel)&&ix.includes(S.sel)){mostra.add(S.sel);mostra.delete(S.sel-1);mostra.delete(S.sel+1);}
  const anoFeito=new Set();
  ix.forEach((i,k)=>{
    if(!mostra.has(i)&&!(dois&&k===0&&passoX===1))return;
    s+=`<text x="${X(k)}" y="${T+ih+11}" font-size="8.5" text-anchor="middle" fill="${i===S.sel?'#1b2430':'#5b6878'}" font-weight="${i===S.sel?700:400}">${ABR[MS[i].m]}</text>`;
    if(dois&&!anoFeito.has(MS[i].y)){anoFeito.add(MS[i].y);s+=`<text x="${X(k)}" y="${T+ih+21}" font-size="8" text-anchor="middle" fill="#1b2430" font-weight="700">${MS[i].y}</text>`;}
  });
  if(dois)ix.forEach((i,k)=>{if(k>0&&MS[i].m===0){const x=L+k*slot;s+=`<line x1="${x}" x2="${x}" y1="${T+ih}" y2="${T+ih+22}" stroke="#b8c0cb"/>`;}});
  let yMeta=null;
  if(cfg.meta){yMeta=Y(cfg.meta);s+=`<line x1="${L}" x2="${L+iw}" y1="${yMeta}" y2="${yMeta}" stroke="#d97400" stroke-width="1.6" stroke-dasharray="2 3"/>`;}
  const curva=pts=>{let d='M'+pts[0][0]+' '+pts[0][1];for(let j=0;j<pts.length-1;j++){const p0=pts[j-1]||pts[j],p1=pts[j],p2=pts[j+1],p3=pts[j+2]||p2;d+=` C${p1[0]+(p2[0]-p0[0])/6} ${p1[1]+(p2[1]-p0[1])/6},${p2[0]-(p3[0]-p1[0])/6} ${p2[1]-(p3[1]-p1[1])/6},${p2[0]} ${p2[1]}`;}return d;};
  let yMed=null,vMed=null;
  if(cfg.media){
    const pts=[];mAc.forEach((v,k)=>{if(v!=null)pts.push([X(k),Y(v),v,ix[k]]);});
    if(pts.length){
      s+=`<path d="${curva(pts)}" fill="none" stroke="#7f1d1d" stroke-width="1.8"/>`;
      pts.forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${p[3]===S.sel?3.4:2.4}" fill="#7f1d1d" stroke="#fff" stroke-width="1"><title>média acumulada até ${MS[p[3]].lb}: ${R(p[2])}</title></circle>`);
      const alvo=pts.find(p=>p[3]===S.sel)||pts[pts.length-1];yMed=alvo[1];vMed=alvo[2];
    }
  }
  if(yMeta!==null&&yMed!==null&&Math.abs(yMeta-yMed)<10){yMed=yMed<=yMeta?yMeta-10:yMeta+10;}
  if(yMeta!==null&&!l2)s+=`<text x="${L+iw+3}" y="${yMeta+3}" font-size="7.5" fill="#a85a00">${fmtL(cfg.meta)}</text>`;
  if(yMed!==null&&!l2)s+=`<text x="${L+iw+3}" y="${yMed+3}" font-size="7.5" font-weight="700" fill="#7f1d1d">${fmtL(vMed)}</text>`;
  if(l2){
    const pts=l2.vals.map((v,k)=>[X(k),YR(v),v,ix[k]]);
    s+=`<path d="${curva(pts)}" fill="none" stroke="#1e7a3c" stroke-width="2"/>`;
    pts.forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${p[3]===S.sel?3.6:2.6}" fill="${p[2]<0?'#b3261e':'#1e7a3c'}" stroke="#fff" stroke-width="1"><title>saldo final de ${MS[p[3]].lb}: ${R(p[2])}</title></circle>`);
  }
  ix.forEach((i,k)=>{s+=`<rect x="${L+k*slot}" y="${T}" width="${slot}" height="${ih+B}" fill="transparent" style="cursor:pointer" onclick="set({sel:${i}})"><title>Ver ${MS[i].lb}</title></rect>`;});
  el.innerHTML=s+'</svg>';
}

function controlesPeriodo(dark){
  const [a,b]=faixa();
  return `<div class="seg ${dark?'seg-dark':''}">${[['ano','Ano'],['u12','Últ. 12'],['66','6 + 6']].map(([id,r])=>`<button class="${S.faixa===id?'on':''}" onclick="set({faixa:'${id}',pop:null})" title="${id==='ano'?'jan a dez do ano do mês escolhido':id==='u12'?'12 meses até o mês escolhido':'6 meses antes e 6 depois do mês escolhido'}">${r}</button>`).join('')}</div>
  <div class="popwrap"><button class="popbtn" style="width:128px;${S.faixa==='per'?'border-color:var(--top);font-weight:600':''}" onclick="abrirPop('per',event)"><span>${MS[a].lb} → ${MS[b].lb}</span><span>▾</span></button>${S.pop==='per'?popPeriodo():''}</div>`;
}
function rotContas(){const n=S.contas.filter(Boolean).length;return n===CONTAS.length?'todas as contas':n===1?CONTAS[S.contas.indexOf(true)][0]:n+' contas';}
function abrirPop(p,e){e.stopPropagation();const[a,b]=faixa();set({pop:S.pop===p?null:p,pyDe:MS[a].y,pyAte:MS[b].y});}
function popPeriodo(){
  const[a,b]=faixa();
  const painel=(rot,campo,ano)=>`<div class="pn"><div class="ph"><small>${rot}</small><div><button onclick="event.stopPropagation();set({${campo==='de'?'pyDe':'pyAte'}:Math.max(2025,${ano}-1)})" aria-label="Ano anterior">‹</button><b>${ano}</b><button onclick="event.stopPropagation();set({${campo==='de'?'pyDe':'pyAte'}:Math.min(2027,${ano}+1)})" aria-label="Próximo ano">›</button></div></div>
    <div class="mg">${ABR.map((m,k)=>{const i=MS.findIndex(x=>x.y===ano&&x.m===k);const on=campo==='de'?i===a:i===b;const inn=i>a&&i<b;
      return `<button class="${on?'on':inn?'in':''} ${i>ATUAL?'fut':''}" onclick="event.stopPropagation();escolher('${campo}',${i})">${m}</button>`;}).join('')}</div></div>`;
  return `<div class="pop" onclick="event.stopPropagation()"><div class="mp">${painel('DE','de',S.pyDe)}${painel('ATÉ','ate',S.pyAte)}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:7px;font-size:9px;color:var(--muted)"><span>${idxs().length} meses · tracejado = previsto</span><button class="popbtn" onclick="set({pop:null})">OK</button></div></div>`;
}
function escolher(campo,i){const[a,b]=faixa();let de=campo==='de'?i:a,ate=campo==='ate'?i:b;if(de>ate){const t=de;de=ate;ate=t;}set({faixa:'per',de,ate});}
function controlesContas(dark){
  const n=S.contas.filter(Boolean).length;
  const rot=n===CONTAS.length?'Todas as contas':n===1?CONTAS[S.contas.indexOf(true)][0]:n+' contas';
  return `<div class="popwrap"><button class="popbtn" style="width:${dark?124:136}px;${n<CONTAS.length?'border-color:#f2b84b;':''}" onclick="abrirPop('contas',event)" title="Contas: ${rot}"><span class="ell">${rot}</span><span>▾</span></button>${S.pop==='contas'?popContas():''}</div>`;
}
function popContas(){
  const todas=S.contas.every(Boolean);let ult='';
  return `<div class="pop" style="width:250px" onclick="event.stopPropagation()">
    <label class="ck" style="font-weight:700;border-bottom:1px solid var(--line);margin-bottom:3px"><input type="checkbox" ${todas?'checked':''} onchange="set({contas:CONTAS.map(()=>${!todas})})"><span>Todas as contas</span><small></small></label>
    ${CONTAS.map(([nome,tipo],i)=>{const cab=tipo!==ult?`<div style="font-size:8px;color:var(--muted);letter-spacing:.05em;font-weight:600;padding:4px 0 1px">${tipo.toUpperCase()}</div>`:'';ult=tipo;
      return cab+`<label class="ck"><input type="checkbox" ${S.contas[i]?'checked':''} onchange="tglConta(${i})"><span class="ell">${nome}</span><small><button class="so" onclick="event.preventDefault();soConta(${i})">só esta</button></small></label>`;}).join('')}</div>`;
}
function tglConta(i){const c=S.contas.slice();c[i]=!c[i];if(!c.some(Boolean))return render();set({contas:c});}
function soConta(i){set({contas:CONTAS.map((x,k)=>k===i)});}

function cardFluxo(sel){
  const e=val(TREE.ent,sel),s=val(TREE.sai,sel),res=e-s;
  const bloco=tp=>{const r=TREE[tp],T=val(r,sel),cor=tp==='ent'?'var(--entr)':'var(--red)';
    return `<button class="tr" style="grid-template-columns:minmax(0,1fr) 112px 42px;height:20px;border-bottom:2px solid var(--ink);margin-top:2px" onclick="abrirModal('${tp}',-1)"><span style="font-weight:700">${r.nome} <span style="color:#8d9cad">›</span></span><span class="r num" style="font-size:13px;font-weight:700;color:${cor}">${R(T)}</span><span class="r num" style="font-weight:700;color:var(--muted)">100%</span></button>`+
    r.kids.map((g,gi)=>{const v=val(g,sel);return `<button class="tr" style="grid-template-columns:minmax(0,1fr) 112px 42px;height:17px" onclick="abrirModal('${tp}',${gi})"><span class="ell" style="display:flex;align-items:center;gap:5px"><i style="width:8px;height:8px;border-radius:2px;background:${g.cor};flex:0 0 auto"></i><span class="ell">${g.nome}</span> <span style="color:#8d9cad">›</span></span><span class="r num">${R(v)}</span><span class="r num" style="color:var(--muted)">${pct(v,T)}</span></button>`;}).join('');};
  const si=saldoIni(sel),sf=saldoIni(sel+1);
  const selc=CONTAS.map((c,k)=>k).filter(k=>S.contas[k]);const dia=Math.min(...selc.map(k=>ULT_CONC[k]));
  const sc=si+(val(TREE.ent,sel)-val(TREE.sai,sel))*dia/31;
  const dica=selc.map(k=>CONTAS[k][0]+': '+ULT_CONC[k]+'/10').join(' · ');
  return `<div style="display:flex;justify-content:space-between;align-items:baseline"><span class="ttl">Entradas e saídas · ${MS[sel].lb}${sel>ATUAL?' (previsto)':''}</span><span class="hint">clique para analisar</span></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:10px;height:17px;align-items:center;margin-top:3px">
      <span style="display:flex;justify-content:space-between;background:#f1f3f6;padding:0 5px;height:17px;align-items:center"><span style="font-weight:600">Saldo 1º/${MS[sel].lb}</span><span class="num" style="font-weight:700;color:${corRes(si)}">${R(si)}</span></span>
      ${sel===ATUAL?`<span style="display:flex;justify-content:space-between;background:#eaf4ec;padding:0 5px;height:17px;align-items:center" title="Último dia conciliado por conta — ${dica}"><span style="font-weight:600">Conciliado até ${String(dia).padStart(2,'0')}/10</span><span class="num" style="font-weight:700;color:${corRes(sc)}">${R(sc)}</span></span>`:`<span style="display:flex;justify-content:space-between;padding:0 5px;color:var(--muted);height:17px;align-items:center"><span>${sel<ATUAL?'mês conciliado':'mês previsto'}</span><span></span></span>`}</div>
    ${bloco('ent')}${bloco('sai')}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 5px 0;font-size:10.5px;font-weight:700">
      <span style="display:flex;justify-content:space-between"><span>Resultado</span><span class="num" style="color:${corRes(res)}">${R(res)}</span></span>
      <span style="display:flex;justify-content:space-between;background:#f1f3f6;padding:0 4px"><span>Saldo final${sel>=ATUAL?' previsto':''}</span><span class="num" style="color:${corRes(sf)}">${R(sf)}</span></span></div>`;
}
function grade(ix){
  const n=ix.length,comp=n>14;
  const cols=`170px repeat(${n},minmax(${comp?28:42}px,1fr)) ${comp?54:64}px ${comp?50:58}px 44px`;
  const fmt=v=>comp?K1(v):N0(v);
  const fs=comp?'font-size:9px;':'';
  const cel=(i,v,cor,neg)=>`<span class="r num" style="${fs}color:${neg?corRes(v):cor};border-left:1px solid #eef1f5;${i===S.sel?'background:var(--colSel);font-weight:700;':i>ATUAL?'background:#f8f9fb;font-style:italic;':''}">${fmt(v)}</span>`;
  const linha=(nome,serie,cor,{forte,fundo,click,pad,sinalCor,tot,pctBase,semTotal}={})=>{
    const vs=ix.map(i=>serie(i)),t=soma(vs);const tag=click?'button':'div';
    return `<${tag} class="tr" ${click?`onclick="${click}"`:''} style="grid-template-columns:${cols};background:${fundo||'#fff'};${forte?'font-weight:700;':''}"><span class="ell" style="padding-left:${pad||5}px;color:${cor}">${nome}</span>${ix.map((i,k)=>cel(i,vs[k],cor,sinalCor)).join('')}<span class="r num" style="${fs}color:${sinalCor?corRes(t):cor};border-left:2px solid #8a96a6;background:rgba(68,84,106,.07);align-self:stretch;display:flex;align-items:center;justify-content:flex-end;font-weight:700">${semTotal?'':fmt(t)}</span><span class="r num" style="${fs}color:${sinalCor?corRes(t/n):cor};border-left:1px solid #dde2e8;background:rgba(68,84,106,.07);align-self:stretch;display:flex;align-items:center;justify-content:flex-end;font-weight:700">${semTotal?'':fmt(t/n)}</span><span class="r num" style="color:var(--muted);border-left:1px solid #dde2e8;background:rgba(68,84,106,.07);align-self:stretch;display:flex;align-items:center;justify-content:flex-end">${pctBase?pct(t,pctBase):''}</span></${tag}>`;
  };
  const E=TREE.ent,Sx=TREE.sai,tE=soma(ix.map(i=>val(E,i))),tS=soma(ix.map(i=>val(Sx,i)));
  const grupos=tp=>TREE[tp].kids.map((g,gi)=>linha(g.nome+'  ›',i=>val(g,i),tp==='sai'?'var(--red)':'var(--entr)',{click:`abrirModal('${tp}',${gi})`,pad:16,pctBase:tp==='sai'?tS:tE})).join('');
  const saldoLinha=(nome,f)=>{const vs=ix.map(f);return `<div class="tr" style="grid-template-columns:${cols};background:#f1f3f6;font-weight:700"><span class="ell" style="padding-left:5px">${nome}</span>${ix.map((i,k)=>cel(i,vs[k],'',true)).join('')}<span style="border-left:2px solid #8a96a6;background:rgba(68,84,106,.07);align-self:stretch"></span><span style="border-left:1px solid #dde2e8;background:rgba(68,84,106,.07);align-self:stretch"></span><span style="border-left:1px solid #dde2e8;background:rgba(68,84,106,.07);align-self:stretch"></span></div>`;};
  return `<section class="card grade">
    <div class="th th2" style="grid-template-columns:${cols}"><span style="display:flex;flex-direction:column;justify-content:flex-end">R$${comp?' MIL':''} · ${ix.some(i=>i>ATUAL)?'REALIZADO + PREVISTO':'REALIZADO'}</span>${ix.map((i,k)=>`<span class="r" style="display:flex;flex-direction:column;align-items:flex-end;border-left:${MS[i].m===0&&k>0?'2px solid #c8d2de':'1px solid #5a6a80'};${i===S.sel?'background:#1b2430;box-shadow:inset 0 -2px 0 #f2b84b;':i>ATUAL?'background:#55657a;':''}"><small style="font-size:7.5px;opacity:.8;height:9px;line-height:9px">${k===0||MS[i].m===0?MS[i].y:''}</small><span>${ABR[MS[i].m].toUpperCase()}${i>ATUAL&&!comp?' ·P':''}</span></span>`).join('')}<span class="r" style="display:flex;align-items:flex-end;justify-content:flex-end;border-left:2px solid #c8d2de;background:#2f3d4f">TOTAL</span><span class="r" style="display:flex;align-items:flex-end;justify-content:flex-end;border-left:1px solid #5a6a80;background:#2f3d4f">MÉDIA</span><span class="r" style="display:flex;align-items:flex-end;justify-content:flex-end;border-left:1px solid #5a6a80;background:#2f3d4f">%</span></div>
    ${saldoLinha('SALDO INICIAL',i=>saldoIni(i))}
    ${linha('ENTRADAS  ›',i=>val(E,i),'var(--entr)',{forte:1,fundo:'#eef3fa',click:`abrirModal('ent',-1)`})}
    ${grupos('ent')}
    ${linha('SAÍDAS TOTAIS  ›',i=>val(Sx,i),'var(--red)',{forte:1,fundo:'#fbeeee',click:`abrirModal('sai',-1)`})}
    ${grupos('sai')}
    ${linha('RESULTADO',i=>val(E,i)-val(Sx,i),'var(--ink)',{forte:1,fundo:'#f1f3f6',sinalCor:1})}
    ${saldoLinha('SALDO FINAL',i=>saldoIni(i+1))}
  </section>`;
}

// ---------------- modal: raiz (Saídas/Entradas) → grupo → categoria → subcentro ----------------

  const perRot=MS[ri[0]].lb+'–'+MS[sel].lb;

  const N=tab<0?root:root.kids[tab];            // nó da aba

    const mt=metaV(x)*fator,d=real-mt,dp=mt?d/mt*100:0;

  const crumb=partes.map((p,j)=>j===partes.length-1?`<span class="cur ell">${p.nome}${graf===root?' · total':''}</span>`:`<button class="lv" onclick="${p.go}">${p.nome} ›</button>`).join('');

  return `<div class="ov"><div class="modal" role="dialog" aria-modal="true" aria-label="Análise de ${root.nome.toLowerCase()}">

// ---------------- lançamentos (ilustrativos) e gaveta lateral ----------------
function lancamentos(leaf,i){
  const total=val(leaf,i);const seed=leaf.nome.length*7+leaf.path.reduce((a,x)=>a*3+x,1)+i;
  const k=Math.max(1,Math.min(9,Math.round(leaf.s[i]/180)+1));const fav=FAV[leaf.nome]||[leaf.nome];
  let contas=CONTAS.map((c,j)=>j).filter(j=>S.contas[j]&&CONTAS[j][1]!=='Investimento');if(!contas.length)contas=CONTAS.map((c,j)=>j).filter(j=>S.contas[j]);
  const out=[];let acc=0;
  for(let j=0;j<k;j++)out.push({w:1+0.5*Math.sin(seed+j*1.9),dia:1+((seed*3+j*7)%28),fav:fav[(seed+j)%fav.length],conta:CONTAS[contas[(seed+j*2)%contas.length]][0]});
  const tw=soma(out.map(x=>x.w));out.forEach((x,j)=>{x.v=j===out.length-1?Math.round((total-acc)*100)/100:Math.round(total*x.w/tw*100)/100;acc+=x.v;});
  return out.sort((a,b)=>a.dia-b.dia);
}
function contaL(nd,i){return nd.kids.length?soma(nd.kids.map(k=>contaL(k,i))):lancamentos(nd,i).length;}
function drawer(tp,sel){
  // estrutura FIXA: cabeçalho 3 faixas (caminho · contexto · atalhos 2 linhas) → indicadores → resumo (4 linhas) → tabela → total
  const path=S.dw,nd=nodeAt(tp,path),root=TREE[tp],corT=tp==='sai'?'var(--red)':'var(--entr)',folha=!nd.kids.length;
  const bc=[`<button class="l" onclick="set({dw:[]})">${root.nome}</button>`].concat(path.map((p,j)=>{const x=nodeAt(tp,path.slice(0,j+1));return j===path.length-1?`<b>${x.nome}</b>`:`<button class="l" onclick="set({dw:[${path.slice(0,j+1).join(',')}]})">${x.nome}</button>`;})).join(' › ');
  const pai=path.length?nodeAt(tp,path.slice(0,-1)):null;
  const chips=pai?pai.kids.map((x,k)=>`<button class="${k===path[path.length-1]?'on':''}" onclick="set({dw:[${path.slice(0,-1).concat([k]).join(',')}]})">${x.nome}</button>`).join(''):'<span style="font-size:9.5px;color:var(--muted)">nível mais alto do plano de contas</span>';
  let tot,q,k3,v3,resumoT,resumo,th,corpo,lc;
  if(folha){
    const ls=lancamentos(nd,sel);tot=soma(ls.map(x=>x.v));q=ls.length;k3='VALOR MÉDIO';v3=R(tot/ls.length);
    const pf={};ls.forEach(l=>{pf[l.fav]=pf[l.fav]||{q:0,v:0};pf[l.fav].q++;pf[l.fav].v+=l.v;});
    resumoT='POR FAVORECIDO';resumo=Object.entries(pf).sort((a,b)=>b[1].v-a[1].v).slice(0,4).map(([f,o])=>[f,o.q+'×',R(o.v)]);
    lc='76px minmax(0,1fr) 124px 84px';
    th=`<span>DATA</span><span>FAVORECIDO</span><span>CONTA</span><span class="r">VALOR</span>`;
    corpo=ls.map(l=>`<div class="tr" style="grid-template-columns:${lc}"><span class="num" style="font-size:8.5px;color:#3a4655">${String(l.dia).padStart(2,'0')}/${String(MS[sel].m+1).padStart(2,'0')}/${MS[sel].y}</span><span class="ell" title="${l.fav}">${l.fav}</span><span class="ell" style="color:var(--muted)" title="${l.conta}">${l.conta}</span><span class="r num" style="color:${corT}">${br(l.v,2)}</span></div>`).join('');
  }else{
    tot=val(nd,sel);q=contaL(nd,sel);k3='ITENS';v3=String(nd.kids.length);
    resumoT='MAIORES ITENS';resumo=nd.kids.slice().sort((a,b)=>val(b,sel)-val(a,sel)).slice(0,4).map(x=>[x.nome,pct(val(x,sel),tot),R(val(x,sel))]);
    lc='76px minmax(0,1fr) 124px 84px';
    th=`<span>LANÇ.</span><span>ITEM · clique para descer</span><span class="r">%</span><span class="r">VALOR</span>`;
    corpo=nd.kids.map((x,k)=>`<button class="tr" style="grid-template-columns:${lc}" onclick="set({dw:[${path.concat([k]).join(',')}]})"><span class="num" style="color:var(--muted)">${contaL(x,sel)}</span><span class="ell">${x.nome} <span style="color:#8d9cad">›</span></span><span class="r num" style="color:var(--muted)">${pct(val(x,sel),tot)}</span><span class="r num">${br(val(x,sel),2)}</span></button>`).join('');
  }
  while(resumo.length<4)resumo.push(['','','']);
  return `<aside class="dw" aria-label="Lançamentos">
    <div style="height:104px;flex:0 0 auto;padding:7px 10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px">
      <div class="bc" style="height:22px;flex-wrap:nowrap;overflow:hidden"><span class="ell" style="display:flex;gap:4px;align-items:center">${bc}</span><button class="x" style="margin-left:auto;color:var(--ink);border-color:#cfd6df" aria-label="Fechar lançamentos" onclick="set({dw:null})">×</button></div>
      <span class="ell" style="font-size:9.5px;color:var(--muted);height:13px">${root.nome} de ${MS[sel].lb}${sel>ATUAL?' (previstos)':''} · ${rotContas()}</span>
      <div class="chips" style="height:46px;overflow:hidden;align-content:flex-start">${chips}</div>
    </div>
    <div class="dwk" style="height:46px"><div class="k"><small>LANÇAMENTOS</small><b style="font-size:13px">${q}</b></div><div class="k"><small>TOTAL</small><b style="font-size:13px;color:${corT}">${R(tot)}</b></div><div class="k"><small>${k3}</small><b style="font-size:13px">${v3}</b></div></div>
    <div style="height:96px;flex:0 0 auto;padding:5px 10px;border-bottom:1px solid var(--line)"><div style="font-size:8.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;height:14px">${resumoT}</div>
      ${resumo.map(([a,b,c])=>`<div style="display:grid;grid-template-columns:minmax(0,1fr) 50px 100px;font-size:10px;height:19px;align-items:center"><span class="ell">${a}</span><span class="r num" style="color:var(--muted)">${b}</span><span class="r num">${c}</span></div>`).join('')}</div>
    <div class="th" style="grid-template-columns:${lc};flex:0 0 auto">${th}</div>
    <div class="dwb">${corpo}</div>
    <div style="display:grid;grid-template-columns:${lc};border-top:2px solid var(--ink);font-weight:700;height:24px;align-items:center;flex:0 0 auto"><span></span><span style="padding:0 5px">Total</span><span></span><span class="r num" style="padding:0 5px;color:${corT}">${br(tot,2)}</span></div>
  </aside>`;
}

document.addEventListener('click',e=>{if(S.pop&&!e.target.closest('.pop'))set({pop:null});});
window.addEventListener('resize',()=>render());
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.pop)set({pop:null});else if(S.dw)set({dw:null});else if(S.m)set({m:null});}});
render();
</script>
</body>
</html>
